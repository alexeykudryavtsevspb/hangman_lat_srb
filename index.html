<!DOCTYPE html>
<html lang="sr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кафана</title>
    <link rel="icon" type="image/png" href="img/favicon-16x16.png">
    <!-- Переименованный CSS -->
    <link rel="stylesheet" href="style.css?v=17">
  </head>
  <body>
    <main>
      <!-- 1. Верхняя панель счета и прогресса -->
      <div id="scoreBox">
        <div class="score-row">
          <div class="score-left">
            <span>🔥 <span id="streakDaysValue">0</span> дн.</span>
            <span class="score-divider">|</span>
            <span>🧊 <span id="streakFreezesValue">0/3</span></span>
          </div>
          <div class="score-right">
            <span class="rank-badge">
              <span id="rankIconValue">🪙</span>
              <span id="rankTitleValue">Пролазник</span>
            </span>
            <span class="score-divider">|</span>
            <span>🎯 <span id="currentStreakValue">0</span></span>
            <span class="score-divider">|</span>
            <span>🏆 <span id="recordStreakValue">0</span></span>
          </div>
        </div>
      </div>

      <!-- 2. Блок виселицы и изображения -->
      <div id="gallows">
        <img id="hangmanImage" src="img/hangman0.jpeg" alt="Hangman Game State">
      </div>

      <!-- 3. Инкубатор активных слов -->
      <div id="incubatorContainer">
        <div id="incubatorBox"></div>
      </div>

      <!-- 4. Загаданное слово -->
      <div id="word"></div>

      <!-- 5. Подсказка и кнопка озвучки -->
      <div id="tipContainer">
        <button id="hintButton" class="hint-button" onclick="useHint();">
          🔊 Слушај фрау (-1 бод)
        </button>
        <div id="tipBox"></div>
      </div>

      <!-- 6. Клавиатура -->
      <div id="guesses"></div>

      <!-- 7. Управление и выбор категории -->
      <div id="controls">
        <button id="newGameButton" class="button" onclick="newGame();" disabled>Нова игра</button>

        <div id="categoryContainer">
          <label for="categorySelect">Изаберите категорију:</label>
          <select id="categorySelect" onchange="onCategoryChange();"></select>
          <div id="categoryProgressValue">🎓 Научено у категорији: 0 / 0 (0%)</div>
        </div>
      </div>
    </main>

    <!-- 1. Словари из папки js/ -->
    <script src="js/words_anatomija_1.js?v=17"></script>
    <script src="js/words_phrases.js?v=17"></script>
    <script src="js/words_test.js?v=17"></script>

    <!-- 2. Конфигурация -->
    <script src="js/config.js?v=17"></script>

    <!-- 3. Модули логики (порядок важен) -->
    <script src="js/storage.js?v=17"></script>
    <script src="js/ui.js?v=17"></script>
    <script src="js/audio.js?v=17"></script>
    <script src="js/main.js?v=17"></script>
  </body>
</html>
