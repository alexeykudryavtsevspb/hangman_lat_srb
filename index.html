<!DOCTYPE html>
<html lang="sr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кафана</title>
    <link rel="stylesheet" href="hangman.css?v=12">
  </head>
  <body>
    <main>
      <!-- Рисунок и табло рекордов -->
      <div id="gallows">
        <img id="hangmanImage" src="img/hangman0.jpeg" alt="">
        <div id="scoreBox">
          <span class="score-label">Резултат</span>
          <span id="scoreValue">0</span>
          <div class="score-divider"></div>
          <span class="score-label">Рекорд</span>
          <span id="highScoreValue">0</span>
        </div>
      </div>
      
      <!-- Загаданное слово -->
      <div id="word"></div>

      <!-- Подсказка и кнопка озвучки -->
      <div id="tipContainer">
        <button id="hintButton" class="hint-button" onclick="useHint();">
          🔊 Слушај фрау (-1 бод)
        </button>
        <div id="tipBox"></div>
      </div>

      <!-- Клавиатура -->
      <div id="guesses"></div>
      
      <!-- Управление -->
      <div id="controls">
        <button id="newGameButton" class="button" onclick="newGame();" disabled>Нова игра</button>
        
        <div id="categoryContainer">
          <label for="categorySelect">Изаберите категорију:</label>
          <select id="categorySelect" onchange="onCategoryChange();"></select>
        </div>
      </div>
    </main>

    <!-- 1. Словари (Исправлены имена файлов) -->
    <script src="words_anatomija_1.js?v=12"></script>
    <script src="words_phrases.js?v=12"></script>
    <script src="words_test.js?v=12"></script>
    
    <!-- 2. Конфигурация -->
    <script src="config.js?v=12"></script>

    <!-- 3. Основная логика -->
    <script src="hangman.js?v=12"></script>
  </body>
</html>
