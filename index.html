<!DOCTYPE html>
<html lang="sr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кафана</title>
    <link rel="stylesheet" href="hangman.css?v=9">
  </head>
  <body>
    <main>
      <div id="gallows">
        <img id="hangmanImage" src="img/hangman0.png" alt="Кафана статус">
        <div id="scoreBox">
          <span class="score-label">Резултат</span>
          <span id="scoreValue">0</span>
          <div class="score-divider"></div>
          <span class="score-label">Рекорд</span>
          <span id="highScoreValue">0</span>
        </div>
      </div>
      
      <div id="word"></div>
      <div id="tipBox"></div>
      <div id="guesses"></div>
      
      <div id="controls">
        <button id="newGameButton" class="button" onclick="newGame();" disabled>Нова игра</button>
        
        <div id="categoryContainer">
          <label for="categorySelect">Изаберите категорију:</label>
          <select id="categorySelect" onchange="onCategoryChange();"></select>
        </div>
      </div>
    </main>

    <script src="words_anatomija_1.js?v=9"></script>
    <script src="words_phrases.js?v=9"></script>
    <script src="config.js?v=9"></script>

    <script src="hangman.js?v=9"></script>
  </body>
</html>
